<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f5;padding:32px 16px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <tr>
    <td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background-color:#ffffff;border-radius:16px;overflow:hidden;">
        <tr>
          <td style="padding:32px 40px 0 40px;text-align:center;">
            <img src="https://ai-microtools.vercel.app/logo-icon.png" width="40" height="40" alt="AI Microtools" style="border-radius:8px;display:inline-block;" />
            <div style="margin-top:8px;font-size:15px;font-weight:700;color:#18181b;">AI Microtools</div>
          </td>
        </tr>
        <tr>
          <td style="padding:24px 40px 40px 40px;">
            <h1 style="margin:0 0 12px 0;font-size:20px;font-weight:700;color:#18181b;text-align:center;">You've been invited</h1>
            <p style="margin:0 0 8px 0;font-size:14px;line-height:1.6;color:#3f3f46;text-align:center;">
              You've been invited to join AI Microtools as <strong>{{ .Email }}</strong>. Click below to accept and set up your account.
            </p>
            <div style="text-align:center;margin:28px 0;">
              <a href="{{ .ConfirmationURL }}" style="display:inline-block;background-color:#18181b;color:#ffffff;font-weight:600;font-size:15px;padding:12px 28px;border-radius:8px;text-decoration:none;">Accept invite</a>
            </div>
            <p style="margin:0;font-size:12px;color:#a1a1aa;text-align:center;word-break:break-all;">
              Or paste this link into your browser:<br />
              <a href="{{ .ConfirmationURL }}" style="color:#71717a;">{{ .ConfirmationURL }}</a>
            </p>
          </td>
        </tr>
        <tr>
          <td style="padding:20px 40px;background-color:#fafafa;border-top:1px solid #e4e4e7;">
            <p style="margin:0;font-size:12px;line-height:1.6;color:#71717a;text-align:center;">
              This email was sent by AI Microtools.<br />
              <a href="https://ai-microtools.vercel.app" style="color:#71717a;text-decoration:underline;">ai-microtools.vercel.app</a>
            </p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
